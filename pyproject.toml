[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "klipperforwindows"
version = "0.1.0"
description = "Run Klipper, Moonraker, Mainsail and Fluidd natively on Windows"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["klipperforwindows"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".reference", "app"]

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501"]
